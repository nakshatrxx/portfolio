<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Ambient Gold Glow -->
    <radialGradient id="goldAmbient" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#FDB927" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FDB927" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Blue Glow -->
    <radialGradient id="blueAmbient" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1D428A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1D428A" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Grid Texture -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Pools -->
  <circle cx="150" cy="120" r="320" fill="url(#goldAmbient)" />
  <circle cx="1050" cy="500" r="350" fill="url(#blueAmbient)" />

  <!-- Outer Glass Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="32" fill="rgba(17, 17, 21, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="62" y="52" width="1076" height="526" rx="30" fill="none" stroke="#FDB927" stroke-width="1" stroke-opacity="0.2" />

  <!-- Top Status Badge -->
  <g transform="translate(100, 100)">
    <rect width="470" height="40" rx="20" fill="rgba(253, 185, 39, 0.12)" stroke="#FDB927" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="24" cy="20" r="5" fill="#10B981" />
    <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FDB927" letter-spacing="1">
      JUNIOR AI/ML ENGINEER @ KNOWLEDGE SYNONYMS
    </text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(590, 100)">
    <rect width="210" height="40" rx="20" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="105" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#D4D4D8">
      📍 Based in New Delhi, IN
    </text>
  </g>

  <!-- #30 Badge -->
  <g transform="translate(980, 95)">
    <rect width="100" height="48" rx="24" fill="rgba(253, 185, 39, 0.15)" stroke="#FDB927" stroke-width="1.5" />
    <text x="50" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FDB927">
      🔥 #30
    </text>
  </g>

  <!-- Main Headline Name -->
  <text x="100" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" letter-spacing="-3">
    NAKSHATRA MITTAL
  </text>

  <!-- Subtitle & Focus Area -->
  <g transform="translate(100, 310)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#FDB927">
      AI/ML Engineer
    </text>
    <text x="215" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#71717A">
      —
    </text>
    <text x="250" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">
      Full-Stack Developer
    </text>
    <text x="555" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#71717A">
      —
    </text>
    <text x="590" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#38BDF8">
      GenAI & RAG
    </text>
  </g>

  <!-- Mission Statement -->
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#A1A1AA">
    Building software that makes AI genuinely useful — from autonomous document-to-course RAG pipelines
  </text>
  <text x="100" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#A1A1AA">
    to high-speed full-stack web applications and interactive canvas experiences.
  </text>

  <!-- Bottom Badges / Tech Highlights -->
  <g transform="translate(100, 480)">
    <!-- Pill 1: SVASU -->
    <rect x="0" y="0" width="190" height="42" rx="10" fill="rgba(253, 185, 39, 0.1)" stroke="#FDB927" stroke-width="1" stroke-opacity="0.4"/>
    <text x="95" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#FDB927">
      ⚡ SVASU RAG Engine
    </text>

    <!-- Pill 2: SCORM -->
    <rect x="205" y="0" width="160" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="285" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="600" fill="#E4E4E7">
      SCORM 1.2 / 2004
    </text>

    <!-- Pill 3: Tech Stack -->
    <rect x="380" y="0" width="220" height="42" rx="10" fill="rgba(29, 66, 138, 0.25)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="490" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="600" fill="#38BDF8">
      React · Angular · Python
    </text>

    <!-- Pill 4: Shootout Game -->
    <rect x="615" y="0" width="190" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="710" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="600" fill="#E4E4E7">
      🏀 Steph Shootout 3PT
    </text>

    <!-- Pill 5: Contact -->
    <rect x="820" y="0" width="160" height="42" rx="10" fill="#FFFFFF" />
    <text x="900" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#000000">
      View Portfolio ↗
    </text>
  </g>
</svg>
